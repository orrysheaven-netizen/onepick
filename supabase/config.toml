project_id = "onepick"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081"]

[auth.hook.before_user_created]
# Only Kakao and Apple may create accounts. The hosted project must enable the
# same hook under Authentication -> Hooks (config.toml only covers local).
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

[functions.import-item-image]
verify_jwt = true

[functions.delete-account]
# The handler authenticates the user with @supabase/server.
verify_jwt = false

[functions.analyze-profile-taste]
# The handler validates the caller Bearer token before reading or generating a review.
verify_jwt = false

[functions.profile-ai-status]
# The handler validates the caller Bearer token before returning private generation state.
verify_jwt = false

[functions.movie-catalog]
# Search is public. The function verifies a real user JWT itself before imports.
verify_jwt = false

[functions.music-catalog]
# Search is public. Import verifies a real user JWT inside the function.
verify_jwt = false

[functions.game-catalog]
# Search is public. Import verifies a real user JWT inside the function.
verify_jwt = false

[functions.youtube-catalog]
# Search and import require a real user JWT. The handler also applies per-user/IP search quotas.
verify_jwt = true


[functions.pokemon-catalog]
# Public species search; selected-species import verifies a real user JWT internally.
verify_jwt = false

[functions.book-catalog]
# Public book search; selected-book import verifies a real user JWT internally.
verify_jwt = false

[functions.suggest-item-categories]
# Authenticated users only; the handler validates the caller JWT and item ownership.
verify_jwt = false

[functions.cleanup-item-photos]
# Daily maintenance endpoint is public at the gateway, but a DB lease makes it
# idempotent and it can only remove server-selected stale, unreferenced paths.
verify_jwt = false

[storage.buckets.item-photos]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg"]

[storage.buckets.brand-logos]
public = true
file_size_limit = "1MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.profile-avatars]
public = true
file_size_limit = "512KiB"
allowed_mime_types = ["image/jpeg"]

[functions.sbiz-place-catalog]
# Admin-only bootstrap endpoint; handler validates the caller and keeps the provider key server-side.
verify_jwt = false


[functions.link-category-suggestions]
# Authenticated users only; the handler revalidates the caller JWT. Naver links
# follow only HTTPS redirects that stay on Naver-owned hosts.
verify_jwt = false
