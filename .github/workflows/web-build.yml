name: Web build

on:
  # No path filter on pull_request: these jobs are required status checks on main,
  # and a filtered-out check never reports, which leaves such a PR unmergeable.
  # Draft PRs and unrelated changes are skipped at job level instead (see `changes`).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'tools/qa/**'
      - '.github/workflows/web-build.yml'

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lightweight gate. Draft PRs skip it entirely (zero runner minutes); for ready
  # PRs it decides whether the required job below needs its heavy steps. Anything
  # other than a successful "no relevant change" verdict runs the full job.
  changes:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts

      - name: Decide whether heavy steps are needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          # The files API stops at 3000 entries; a truncated list must not skip checks.
          if [ "$(wc -l < "$RUNNER_TEMP/changed-files.txt")" -ge 3000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(bash .github/scripts/ci-path-gate.sh \
            --pattern '^(mobile/|tools/qa/|\.github/workflows/web-build\.yml$)' \
            < "$RUNNER_TEMP/changed-files.txt")"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  verify-web:
    needs: changes
    # Required check: keep this job name. When skipped by this condition it reports
    # success, so draft or unrelated PRs never leave the check pending.
    if: >-
      !cancelled() &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (needs.changes.result != 'success' || needs.changes.outputs.run == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check QA script syntax
        working-directory: .
        run: |
          find tools/qa -type f -name '*.mjs' -print0 | sort -z | xargs -0 -r -n1 node --check

      - name: Test CI path gate
        working-directory: .
        run: bash .github/scripts/test-ci-path-gate.sh

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npm run build:web

      - name: Check exported assets and direct routes
        run: npm run check:web
