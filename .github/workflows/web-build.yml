name: Web build

on:
  # No path filter on pull_request: these jobs are required status checks on main,
  # and a filtered-out check never reports, which leaves such a PR unmergeable.
  # Draft PRs and unrelated changes are skipped at job level instead (see `changes`).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'tools/qa/**'
      - '.github/workflows/web-build.yml'

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lightweight gate. Draft PRs skip it entirely (zero runner minutes); for ready
  # PRs it decides whether the required job below needs its heavy steps. Anything
  # other than a successful "no relevant change" verdict runs the full job.
  changes:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      control_plane: ${{ steps.control_plane.outputs.result }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows

      - name: Decide whether heavy steps are needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          # The files API stops at 3000 entries; a truncated list must not skip checks.
          if [ "$(wc -l < "$RUNNER_TEMP/changed-files.txt")" -ge 3000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(bash .github/scripts/ci-path-gate.sh \
            --pattern '^(mobile/|tools/qa/|\.github/workflows/web-build\.yml$)' \
            < "$RUNNER_TEMP/changed-files.txt")"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # Offline regression test for the AI handoff / PM routing control plane (#586).
      # It runs inside this existing lightweight job and only when those files change,
      # so it adds seconds, not a runner. A failure is surfaced by verify-web (the
      # required check) below; this job itself stays green so the path gate still works.
      - name: Control-plane regression test
        id: control_plane
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files.txt"
          if [ "$(wc -l < "$changed")" -lt 3000 ] &&
             ! grep -Eq '^\.github/(workflows/(ai-[^/]+|web-build)\.yml|scripts/test-pm-review-queue\.sh)$' "$changed"; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y -qq python3-yaml >/dev/null || true
          if bash .github/scripts/test-pm-review-queue.sh; then result=passed; else result=failed; fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

  verify-web:
    needs: changes
    # Required check: keep this job name. When skipped by this condition it reports
    # success, so draft or unrelated PRs never leave the check pending.
    if: >-
      !cancelled() &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (needs.changes.result != 'success' || needs.changes.outputs.run == 'true' ||
       needs.changes.outputs.control_plane == 'failed')
    runs-on: ubuntu-latest
    # Caps a hung run's billing (recent full runs ~1-2 min).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      # Fails the required check in seconds, before any heavy step, when the
      # control-plane test in `changes` failed.
      - name: Control-plane regression test result
        if: needs.changes.outputs.control_plane == 'failed'
        working-directory: .
        run: |
          echo "::error::Control-plane regression test failed; see the 'changes' job log (.github/scripts/test-pm-review-queue.sh)."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check QA script syntax
        working-directory: .
        run: |
          find tools/qa -type f -name '*.mjs' -print0 | sort -z | xargs -0 -r -n1 node --check

      - name: Test CI path gate
        working-directory: .
        run: bash .github/scripts/test-ci-path-gate.sh

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npm run build:web

      - name: Check exported assets and direct routes
        run: npm run check:web
