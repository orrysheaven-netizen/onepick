name: Web build

on:
  # No path filter on pull_request: these jobs are required status checks on main,
  # and a filtered-out check never reports, which leaves such a PR unmergeable.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/web-build.yml'

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npm run build:web

      - name: Check exported assets and direct routes
        run: npm run check:web
