name: AI PM Review Queue

# Returns work to the PM (ChatGPT) at completion boundaries that need a planning,
# priority or approval decision. GitHub-internal only: no external webhook/API call.
#
#   담당 완료 -> 완료 리포트 -> PM_REVIEW_REQUIRED -> PM 검토 대기
#
# Sources (comments on the ORIGINAL issue; the source line must be the comment's FIRST line):
#   1. From the repository owner account or the handoff App bot (request only):
#        PM_REVIEW_REQUIRED: reason=<stage-complete|review-complete|merge-ready|release-approval> pr=<N|none> head=<40-hex|none>
#      From the repository owner account ONLY (PM decision):
#        PM_REVIEW_DONE: decision=<continue|revise|block|user-approval> pr=<N|none> head=<40-hex|none>
#      The handoff App identity is shared with the Codex/Claude handoff runners, so a bot
#      PM_REVIEW_DONE could be issued by the assignee itself; it is never a PM decision.
#      Trust boundary that remains: the owner account itself can be used by several manual
#      sessions, so "owner" means the account, not a verified PM. A dedicated PM identity
#      is a follow-up; until then this check separates PM decisions from the App only.
#   2. The CI gate (ai-handoff-ci-gate.yml) done comment
#        <!-- onepick-ci-handoff:done pr=<N> -->
#      for a PR whose bot pending marker says next=user (right before the user merge
#      decision). next=claude|codex is an ordinary AI handoff and never reaches the PM queue.
#
# Durable queue (no event is lost to concurrency pending-run replacement):
#   1. enqueue (no concurrency): every trusted, well-formed source is appended to the
#      original issue as a bot marker, once per SOURCE_ID
#        <!-- onepick-pm-queue:pending source=comment-<id> kind=<required|done|gate>
#             arg=<reason|decision> pr=<N|none> head=<SHA|short SHA|none> -->
#   2. drain (repository-wide concurrency, cancel-in-progress: false): processes ALL
#      pending markers without a matching
#        <!-- onepick-pm-queue:processed source=comment-<id> -->
#      on the event's issue first, then on EVERY open issue with comments, in source
#      comment order (the order the requests were written, not the order they were
#      enqueued). A drain run replaced or cancelled while pending leaves its markers in
#      place; the newest queued drain (never replaced) collects them. drain runs only
#      when enqueue appended or found a marker, so ordinary comments start no runner.
#   A failed item stays pending and is retried by the next drain; the other items of that
#   issue wait so request/decision order is kept. After MAX_ATTEMPTS failures the item is
#   closed with a processed marker and a "수동 확인 필요" note instead of retrying forever.
#
# Result markers (valid ONLY when written by the handoff App bot, i.e. this workflow). Each
# result comment also carries the item's processed marker, so result and processed state
# are written in one comment:
#   <!-- onepick-pm-review:required issue=<N> pr=<N|none> head=<SHA|none> -->
#   <!-- onepick-pm-review:done issue=<N> pr=<N|none> head=<SHA|none> decision=<...> -->
# A decision counts only when it was written AFTER the matching "PM 검토 대기" comment and
# still refers to the PR's current head; an earlier or stale PM_REVIEW_DONE is not recorded.
# decision=block adds state:blocked (additive label call, never a full label rewrite) before
# the record; if the record then fails, the next drain sees the label and only writes the
# record, so state:blocked is applied once.
#
# This workflow only writes issue comments (and state:blocked for decision=block). It never
# adds handoff labels, advances product work, checks out or runs PR code, merges, deploys,
# applies DB changes, or touches secrets/permissions.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  enqueue:
    # First-line prefixes only: bot summaries and notes that merely quote a command line
    # (e.g. the PM_REVIEW_DONE example in "PM 검토 대기") never start a runner.
    if: >-
      vars.ONEPICK_PM_ROUTING_ENABLED != 'false' &&
      github.event.issue.pull_request == null &&
      (startsWith(github.event.comment.body, 'PM_REVIEW_REQUIRED: ') ||
       startsWith(github.event.comment.body, 'PM_REVIEW_DONE: ') ||
       startsWith(github.event.comment.body, '<!-- onepick-ci-handoff:done pr='))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enqueued: ${{ steps.enqueue.outputs.enqueued }}
    steps:
      - name: Create handoff App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.AI_HANDOFF_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_HANDOFF_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Verify source and append queue marker
        id: enqueue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_AUTHOR: ${{ github.event.comment.user.login }}
          SOURCE_ID: ${{ github.event.comment.id }}
          SOURCE_URL: ${{ github.event.comment.html_url }}
          SOURCE_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail

          bot_login="${APP_SLUG}[bot]"
          skip() { echo "skip: $*"; exit 0; }

          # 1. Trusted actor only.
          if [ "$SOURCE_AUTHOR" = "$REPOSITORY_OWNER" ]; then
            by="owner"
          elif [ "$SOURCE_AUTHOR" = "$bot_login" ]; then
            by="bot"
          else
            skip "author $SOURCE_AUTHOR is not trusted"
          fi
          [[ "$SOURCE_ID" =~ ^[0-9]+$ ]] || skip "invalid source id"
          source="comment-$SOURCE_ID"

          # 2. Parse the first line strictly (the same line the job condition matched).
          # Parameter expansion, not a pipe: a long body cannot SIGPIPE under pipefail.
          first_line="${SOURCE_BODY%%$'\n'*}"
          first_line="${first_line%$'\r'}"
          kind="" arg="" pr="" head=""
          ref_re='pr=(none|[0-9]{1,7}) head=(none|[0-9a-f]{40})[[:space:]]*$'
          gate_re='^<!-- onepick-ci-handoff:done pr=([0-9]{1,7}) -->[[:space:]]*$'
          gate_head_re='\(head `([0-9a-f]{7})`\)'
          if [[ "$first_line" =~ ^PM_REVIEW_REQUIRED:\ reason=(stage-complete|review-complete|merge-ready|release-approval)\ ${ref_re} ]]; then
            kind="required"; arg="${BASH_REMATCH[1]}"; pr="${BASH_REMATCH[2]}"; head="${BASH_REMATCH[3]}"
          elif [[ "$first_line" =~ ^PM_REVIEW_DONE:\ decision=(continue|revise|block|user-approval)\ ${ref_re} ]]; then
            # PM decisions come from the owner account only, never from the shared handoff App.
            [ "$by" = "owner" ] || skip "PM_REVIEW_DONE from $SOURCE_AUTHOR is not accepted (owner account only)"
            kind="done"; arg="${BASH_REMATCH[1]}"; pr="${BASH_REMATCH[2]}"; head="${BASH_REMATCH[3]}"
          elif [ "$by" = "bot" ] && [[ "$first_line" =~ $gate_re ]]; then
            kind="gate"; arg="merge-ready"; pr="${BASH_REMATCH[1]}"
            [[ "$SOURCE_BODY" =~ $gate_head_re ]] || skip "gate comment has no head"
            head="${BASH_REMATCH[1]}"
          else
            skip "no PM review request, decision or gate result on the first line"
          fi
          if { [ "$pr" = "none" ] && [ "$head" != "none" ]; } || { [ "$pr" != "none" ] && [ "$head" = "none" ]; }; then
            skip "pr and head must both be set or both be none"
          fi

          [ "$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq '.state')" = "open" ] ||
            skip "issue #$ISSUE_NUMBER is closed"

          comments="$(gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s 'add // []')"

          # 3. CI gate: queue only when this PR's bot pending marker said next=user
          #    (re-checked when drained). Ordinary AI handoffs never start a drain.
          if [ "$kind" = "gate" ]; then
            next_owner="$(
              jq -r --arg bot "$bot_login" --arg pr "$pr" --arg me "$SOURCE_ID" '
                [ .[] | select(.user.login == $bot and ((.id | tostring) != $me))
                  | (.body | capture("<!-- onepick-ci-handoff:pending pr=\($pr) next=(?<next>claude|codex|user) -->")?)
                  | .next ] | last // ""
              ' <<<"$comments"
            )"
            [ "$next_owner" = "user" ] || skip "CI gate result for PR #$pr hands off to '${next_owner:-unknown}', not a PM boundary"
          fi

          # 4. Append once per SOURCE_ID (bot markers only).
          if jq -e --arg bot "$bot_login" --arg m "<!-- onepick-pm-queue:pending source=${source} " '
               any(.[]; .user.login == $bot and (.body | contains($m)))' <<<"$comments" >/dev/null; then
            # Already queued (e.g. workflow re-run): let the drain collect it.
            echo "enqueued=true" >> "$GITHUB_OUTPUT"
            skip "source $source already queued"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$(cat <<EOF
          <!-- onepick-pm-queue:pending source=${source} kind=${kind} arg=${arg} pr=${pr} head=${head} -->
          PM 큐 접수 (\`${kind}\` ${arg}, PR ${pr} head \`${head:0:7}\`) — 처리 대기. 근거: ${SOURCE_URL}
          EOF
          )"
          echo "enqueued=true" >> "$GITHUB_OUTPUT"

  drain:
    needs: enqueue
    # Runs only when a queue marker exists for this event. Leftovers from replaced,
    # cancelled or failed drains are collected by the next drain.
    if: ${{ !cancelled() && needs.enqueue.outputs.enqueued == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    # Only the drain is serialized, repository-wide (it sweeps every issue). enqueue has no
    # concurrency, so a drain run replaced while pending never loses its event.
    concurrency:
      group: ai-pm-review-queue-drain-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Create handoff App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.AI_HANDOFF_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_HANDOFF_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-issues: write
          permission-pull-requests: read

      - name: Process every unprocessed queue marker
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          MAX_ATTEMPTS: '3'
          REQUIRED_WORKFLOWS: '["Mobile CI","Database Tests","Web build"]'
        shell: bash
        run: |
          set -euo pipefail

          bot_login="${APP_SLUG}[bot]"

          comments_of() {
            gh api --paginate "repos/$REPOSITORY/issues/$1/comments?per_page=100" | jq -s 'add // []'
          }
          # First id of a bot-authored comment (in comments JSON $1) that contains $2.
          bot_comment_id() {
            jq -r --arg bot "$bot_login" --arg m "$2" '
              [ .[] | select(.user.login == $bot and (.body | contains($m))) | .id ] | first // ""
            ' <<<"$1"
          }
          post() { gh issue comment "$1" --repo "$REPOSITORY" --body "$2" >/dev/null; }
          processed_marker() { printf '<!-- onepick-pm-queue:processed source=%s -->' "$1"; }
          skip_item() {
            echo "skip $2 on #$1: $3"
            post "$1" "$(processed_marker "$2")"$'\n'"PM 큐 항목 \`$2\` 처리 생략: $3"
          }

          # One queue item. Every check is evaluated against the CURRENT state. Any API error
          # aborts the item (errexit in the caller's subshell) and leaves it pending.
          process_item() {
            local issue="$1" item="$2"
            local source kind arg pr head sid source_url
            source="$(jq -r '.source' <<<"$item")"; kind="$(jq -r '.kind' <<<"$item")"
            arg="$(jq -r '.arg' <<<"$item")"; pr="$(jq -r '.pr' <<<"$item")"; head="$(jq -r '.head' <<<"$item")"
            sid="${source#comment-}"
            source_url="https://github.com/$REPOSITORY/issues/$issue#issuecomment-$sid"

            local issue_json labels comments blocked=false
            issue_json="$(gh api "repos/$REPOSITORY/issues/$issue")"
            labels="$(jq -c '[.labels[].name]' <<<"$issue_json")"
            comments="$(comments_of "$issue")"

            if [ -n "$(bot_comment_id "$comments" "$(processed_marker "$source")")" ]; then
              echo "skip $source: already processed"; return 0
            fi
            if [ "$(jq -r '.state' <<<"$issue_json")" != "open" ]; then
              skip_item "$issue" "$source" "원래 이슈가 닫힘"; return 0
            fi
            if jq -e 'index("state:blocked") != null' <<<"$labels" >/dev/null; then blocked=true; fi
            # decision=block whose label was applied but whose record failed is recovered below.
            if [ "$blocked" = "true" ] && ! { [ "$kind" = "done" ] && [ "$arg" = "block" ]; }; then
              skip_item "$issue" "$source" "이슈가 state:blocked"; return 0
            fi

            # PR checks: must reference this issue, and head must be the PR's CURRENT head.
            local pr_json current_head
            if [ "$pr" != "none" ]; then
              pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr")"
              if ! jq -e --arg repo "$REPOSITORY" --arg n "$issue" '
                     .base.ref == "main" and .head.repo.full_name == $repo and
                     (.state == "open" or .merged == true) and
                     ((.body // "") | test("Refs #\($n)([^0-9]|$)"))
                   ' <<<"$pr_json" >/dev/null; then
                skip_item "$issue" "$source" "PR #$pr이 main 대상 같은 저장소 PR이 아니거나 이 이슈를 참조하지 않음"; return 0
              fi
              current_head="$(jq -r '.head.sha' <<<"$pr_json")"
              if [ "$kind" = "gate" ]; then
                if [ "${current_head:0:7}" != "$head" ]; then
                  skip_item "$issue" "$source" "이전 head \`${head}\`의 CI 결과 (현재 PR head \`${current_head:0:7}\`)"; return 0
                fi
                head="$current_head"
              elif [ "$head" != "$current_head" ]; then
                skip_item "$issue" "$source" "stale head \`${head:0:7}\` (현재 PR head \`${current_head:0:7}\`)"; return 0
              fi
            fi

            local key="issue=${issue} pr=${pr} head=${head}"
            local required_id done_id
            required_id="$(bot_comment_id "$comments" "<!-- onepick-pm-review:required ${key} ")"
            done_id="$(bot_comment_id "$comments" "<!-- onepick-pm-review:done ${key} ")"

            # PM decision: once per key, only for a request that existed when it was written.
            if [ "$kind" = "done" ]; then
              # The pending marker is written by the shared App identity, so re-verify the
              # source itself: an owner-authored comment whose first line is this decision.
              local src_line
              src_line="$(
                jq -r --argjson id "$sid" --arg owner "$REPOSITORY_OWNER" '
                  [ .[] | select(.id == $id and .user.login == $owner) | .body ] | first // ""
                  | split("\n")[0] | rtrimstr("\r")
                ' <<<"$comments"
              )"
              if [[ ! "$src_line" =~ ^PM_REVIEW_DONE:\ decision=${arg}\ pr=${pr}\ head=${head}[[:space:]]*$ ]]; then
                skip_item "$issue" "$source" "판정 원문이 저장소 소유자 계정의 PM_REVIEW_DONE 댓글이 아님 (handoff App 판정은 인정하지 않음)"; return 0
              fi
              if [ -z "$required_id" ]; then skip_item "$issue" "$source" "${key}에 대한 PM 검토 요청 없음"; return 0; fi
              if [ -n "$done_id" ]; then skip_item "$issue" "$source" "${key}의 PM 판정이 이미 기록됨"; return 0; fi
              if [ "$sid" -le "$required_id" ]; then
                skip_item "$issue" "$source" "PM 검토 대기 기록보다 먼저 작성된 판정 (오래된 판정)"; return 0
              fi
              local label_note=""
              if [ "$arg" = "block" ]; then
                if [ "$blocked" = "true" ]; then
                  label_note="state:blocked 이미 적용됨 (재적용하지 않음)"
                else
                  # Additive call: never rewrites labels another workflow changed meanwhile.
                  gh api --method POST "repos/$REPOSITORY/issues/$issue/labels" -f 'labels[]=state:blocked' >/dev/null
                  gh api "repos/$REPOSITORY/issues/$issue" --jq '[.labels[].name]' |
                    jq -e 'index("state:blocked") != null' >/dev/null || {
                      echo "::error::state:blocked was not applied to issue #$issue"; return 1; }
                  label_note="state:blocked 적용"
                fi
              fi
              post "$issue" "$(cat <<EOF
          <!-- onepick-pm-review:done ${key} decision=${arg} -->
          $(processed_marker "$source")
          ## PM 판정 기록
          판정: \`${arg}\`${label_note:+ — ${label_note}}
          근거: ${source_url}

          다음 단계는 PM 판정 내용에 따라 담당자/사용자가 진행합니다. 자동으로 진행하지 않습니다.
          EOF
          )"
              return 0
            fi

            # PM review request (explicit or CI gate).
            if [ "$kind" = "gate" ]; then
              local next_owner
              next_owner="$(
                jq -r --arg bot "$bot_login" --arg pr "$pr" '
                  [ .[] | select(.user.login == $bot)
                    | (.body | capture("<!-- onepick-ci-handoff:pending pr=\($pr) next=(?<next>claude|codex|user) -->")?)
                    | .next ] | last // ""
                ' <<<"$comments"
              )"
              if [ "$next_owner" != "user" ]; then
                skip_item "$issue" "$source" "CI gate 결과가 '${next_owner:-unknown}' 인계 대상 (PM 경계 아님)"; return 0
              fi
            fi
            if [ -n "$done_id" ]; then skip_item "$issue" "$source" "${key}의 PM 판정이 이미 존재"; return 0; fi
            if [ -n "$required_id" ]; then skip_item "$issue" "$source" "${key}의 PM 검토가 이미 대기 중"; return 0; fi
            if jq -e 'index("handoff:codex") != null or index("handoff:claude") != null' <<<"$labels" >/dev/null; then
              skip_item "$issue" "$source" "AI 인계가 아직 대기 중 (완료 경계 아님)"; return 0
            fi

            local reason_text approval owner
            case "$arg" in
              stage-complete)   reason_text="부서/단계 작업 완료";         approval="PM 판정 후 결정" ;;
              review-complete)  reason_text="독립 리뷰 완료";              approval="PM 판정 후 결정" ;;
              merge-ready)      reason_text="필수 CI 통과, 병합 판단 직전"; approval="main 병합 (PM 판정 후 사용자)" ;;
              release-approval) reason_text="release/production 승인 직전"; approval="Production 반영 (PM 판정 후 사용자)" ;;
            esac
            owner="$(jq -r '[.[] | select(startswith("owner:")) | ltrimstr("owner:")] | join(", ") | if . == "" then "미지정" else . end' <<<"$labels")"

            local pr_line="없음" ci_line="해당 없음 (PR 없음)" review_line="해당 없음 (PR 없음)"
            if [ "$pr" != "none" ]; then
              pr_line="#${pr} (head \`${head:0:7}\`)"
              ci_line="$(
                gh api -X GET "repos/$REPOSITORY/actions/runs" -f head_sha="$head" -f event=pull_request -f per_page=100 |
                  jq -r --argjson req "$REQUIRED_WORKFLOWS" '
                    .workflow_runs as $all
                    | [ $req[] as $name
                        | ([ $all[] | select(.name == $name) ] | sort_by(.created_at) | last) as $r
                        | "\($name) \(if ($r.status // "missing") == "completed" then $r.conclusion else ($r.status // "missing") end)" ]
                    | join(" / ")'
              )"
              review_line="$(
                gh api "repos/$REPOSITORY/pulls/$pr/reviews?per_page=100" |
                  jq -r --arg h "$head" '
                    [ .[] | select(.commit_id == $h) ] as $r
                    | if ($r | length) == 0 then "현재 head 리뷰 기록 없음"
                      else "현재 head 리뷰 \($r | length)건 (최근: \($r | last | .state))" end'
              )"
            fi

            post "$issue" "$(cat <<EOF
          <!-- onepick-pm-review:required ${key} -->
          $(processed_marker "$source")
          ## PM 검토 대기
          담당 완료: ${reason_text} — 담당 ${owner}
          PR: ${pr_line}
          CI: ${ci_line}
          독립 리뷰: ${review_line}
          남은 위험: 원래 이슈의 완료 리포트 참조 (요청 근거: ${source_url})
          관리자 승인 필요: ${approval}
          관리자 직접 수행 필요: PM 판정에서 명시

          PM 판정 전에는 다음 제품/기획 단계로 진행하지 않습니다.
          판정 기록 (이 댓글 이후 새 댓글의 첫 줄): \`PM_REVIEW_DONE: decision=<continue|revise|block|user-approval> pr=${pr} head=${head}\`
          EOF
          )"
          }

          # A failed item stays pending; count the attempt, and give up with a processed
          # marker at MAX_ATTEMPTS so a permanently failing item cannot retry forever.
          record_failure() {
            local issue="$1" source="$2" comments attempts
            gave_up=false
            comments="$(comments_of "$issue")" || return 1
            attempts="$(jq --arg bot "$bot_login" --arg m "<!-- onepick-pm-queue:failed source=${source} " '
              [ .[] | select(.user.login == $bot and (.body | contains($m))) ] | length + 1' <<<"$comments")"
            if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
              post "$issue" "$(processed_marker "$source")"$'\n'"<!-- onepick-pm-queue:failed source=${source} attempt=${attempts} -->"$'\n'"PM 큐 항목 \`${source}\` 처리 실패 ${attempts}회 — 재시도 상한 도달, 수동 확인 필요 (원 요청을 확인한 뒤 필요하면 새 댓글로 다시 요청)" &&
                gave_up=true
            else
              post "$issue" "<!-- onepick-pm-queue:failed source=${source} attempt=${attempts} -->"$'\n'"PM 큐 항목 \`${source}\` 처리 실패 (${attempts}/${MAX_ATTEMPTS}) — 다음 drain에서 재시도"
            fi
          }

          # Issues to drain: the event's issue first, then EVERY open issue with comments
          # (all pages, no time or count cap), so markers left by a replaced, cancelled or
          # failed drain run are always collected.
          failures=0
          sweep=""
          if ! sweep="$(gh api --paginate -X GET "repos/$REPOSITORY/issues" -f state=open -f per_page=100 \
                          --jq '.[] | select((has("pull_request") | not) and .comments > 0) | .number')"; then
            echo "::error::could not list open issues; draining the event issue only"
            failures=$((failures + 1)); sweep=""
          fi
          issues="$(printf '%s\n%s\n' "${EVENT_ISSUE:-}" "$sweep" | grep -E '^[0-9]+$' | awk '!seen[$0]++' || true)"

          for issue in $issues; do
            if ! comments="$(comments_of "$issue")"; then
              echo "::error::could not read comments of issue #$issue"; failures=$((failures + 1)); continue
            fi
            todo="$(
              jq -c --arg bot "$bot_login" '
                [ .[] | select(.user.login == $bot) ] as $b
                | ([ $b[] | (.body | capture("<!-- onepick-pm-queue:processed source=(?<s>comment-[0-9]+) -->"; "g")?) | .s ]) as $done
                | [ $b[] | (.body | capture("<!-- onepick-pm-queue:pending source=(?<source>comment-[0-9]+) kind=(?<kind>required|done|gate) arg=(?<arg>[a-z-]+) pr=(?<pr>none|[0-9]+) head=(?<head>none|[0-9a-f]{7}|[0-9a-f]{40}) -->")?) ]
                | unique_by(.source)
                | map(select(.source as $s | ($done | index($s)) == null))
                | sort_by(.source | ltrimstr("comment-") | tonumber) | .[]
              ' <<<"$comments"
            )"
            [ -n "$todo" ] || continue
            echo "draining issue #$issue"
            # fd 3 keeps gh calls inside process_item from consuming the queue list.
            while IFS= read -r item <&3; do
              [ -n "$item" ] || continue
              # Subshell with its own errexit: an API failure aborts only this item.
              set +e
              ( set -e; process_item "$issue" "$item" )
              rc=$?
              set -e
              [ "$rc" -eq 0 ] && continue
              failures=$((failures + 1))
              src="$(jq -r '.source' <<<"$item")"
              echo "::error::PM queue item $src on issue #$issue failed (exit $rc)"
              gave_up=false
              record_failure "$issue" "$src" || echo "::error::could not record the failure of $src"
              # An item closed at the retry cap no longer holds the queue. Otherwise keep
              # request/decision order: the rest of this issue waits for the next drain.
              [ "$gave_up" = "true" ] && continue
              break
            done 3<<<"$todo"
          done

          [ "$failures" -eq 0 ] || { echo "::error::$failures PM queue failure(s); pending items are retried by the next drain"; exit 1; }
