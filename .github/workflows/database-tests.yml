name: Database Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  # No path filter on pull_request: these jobs are required status checks on main,
  # and a filtered-out check never reports, which leaves such a PR unmergeable.
  # Draft PRs and unrelated changes are skipped at job level instead (see `changes`).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lightweight gate. Draft PRs skip it entirely (zero runner minutes); for ready
  # PRs it decides whether the required job below needs its heavy steps. Anything
  # other than a successful "no relevant change" verdict runs the full job.
  changes:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # The gate script always comes from the base commit, never from the PR under
      # test, so a PR cannot rewrite the gate to skip its own required checks (#576 M1).
      - name: Checkout gate script (base commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts

      - name: Decide whether heavy steps are needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          # The files API stops at 3000 entries; a truncated list must not skip checks.
          if [ "$(wc -l < "$RUNNER_TEMP/changed-files.txt")" -ge 3000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Control-plane changes (the gate, its tests, any workflow) always run the
          # heavy job. Decided here, not by a script (#576 M1).
          if grep -Eq '^\.github/(scripts|workflows)/' "$RUNNER_TEMP/changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(bash .github/scripts/ci-path-gate.sh \
            --pattern '^(supabase/|tools/[^/]+\.py$|\.github/workflows/database-tests\.yml$)' \
            < "$RUNNER_TEMP/changed-files.txt")"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  database-tests:
    needs: changes
    # Required check: keep this job present on ready PRs. GitHub branch protection
    # does not accept a skipped required job as success, so only heavy steps are gated.
    if: >-
      !cancelled() &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # Caps a hung run's billing (recent full runs ~2-3 min; headroom for Supabase image pulls).
    timeout-minutes: 25

    steps:

      - name: Required check satisfied
        if: needs.changes.result == 'success' && needs.changes.outputs.run != 'true'
        run: echo "No relevant changes; heavy database-tests steps skipped."
      - name: Checkout
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        uses: actions/checkout@v7

      # Fail fast before starting a local database when concurrent branches reused a version.
      - name: Check unique migration versions
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path

          files = sorted(Path("supabase/migrations").glob("*.sql"))
          versions = [path.name.split("_", 1)[0] for path in files]
          duplicates = [version for version, count in Counter(versions).items() if count > 1]
          if duplicates:
              for version in duplicates:
                  matching = [path.name for path in files if path.name.startswith(version + "_")]
                  print(f"Duplicate migration version {version}: " + ", ".join(matching))
              raise SystemExit("Migration version prefixes must be unique.")
          print(f"Checked {len(files)} migrations: all version prefixes are unique.")
          PY

      - name: Test SBIZ place adapter
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        run: python3 tools/test_sbiz_place_adapter.py

      - name: Test place import loader
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        run: python3 tools/test_load_place_import_jsonl.py

      - name: Setup Supabase CLI
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Start local database
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        run: supabase db start

      - name: Run database tests
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        run: supabase test db

      - name: Test profile image concurrency (two local DB sessions)
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        run: python3 tools/test_profile_image_concurrency.py

      - name: Setup Deno
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Check edge functions
        if: needs.changes.result != 'success' || needs.changes.outputs.run == 'true'
        run: |
          deno check --config supabase/functions/import-item-image/deno.json supabase/functions/import-item-image/index.ts
          deno check --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts
          deno check --config supabase/functions/movie-catalog/deno.json supabase/functions/movie-catalog/index.ts
          deno check --config supabase/functions/analyze-profile-taste/deno.json supabase/functions/analyze-profile-taste/index.ts
          deno check --config supabase/functions/profile-ai-status/deno.json supabase/functions/profile-ai-status/index.ts
          deno check --config supabase/functions/suggest-item-categories/deno.json supabase/functions/suggest-item-categories/index.ts
          deno check --config supabase/functions/sbiz-place-catalog/deno.json supabase/functions/sbiz-place-catalog/index.ts
