name: Verify Existing Registration QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-qa
  cancel-in-progress: false

jobs:
  registration:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: daily-qa
    defaults:
      run:
        working-directory: tools/qa
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/qa/package-lock.json
      - name: Install pinned QA dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check registration guard offline
        run: node --test registration-write-contract.test.mjs
      - name: Verify the existing synthetic QA pick without data writes
        env:
          QA_REGISTRATION_MODE: verify_existing
          ONEPICK_QA_EMAIL: ${{ secrets.ONEPICK_QA_EMAIL }}
          ONEPICK_QA_PASSWORD: ${{ secrets.ONEPICK_QA_PASSWORD }}
        run: node registration-write-qa.mjs
