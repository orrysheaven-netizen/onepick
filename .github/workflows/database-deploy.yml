name: Deploy Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/database-deploy.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose dry-run first. Apply only after reviewing the migration list."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: onepick-database-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy credentials live only in the Production environment (main only),
    # not at repository level (#426 M9).
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ygoipwzakzdnkaaxyrgb

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL secret"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Validate IPv4 Session pooler URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          ref = os.environ["SUPABASE_PROJECT_REF"]
          url = urlparse(os.environ["SUPABASE_DB_URL"])
          if url.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("SUPABASE_DB_URL must be a Postgres URL")
          if not (url.hostname or "").endswith(".pooler.supabase.com"):
              raise SystemExit("SUPABASE_DB_URL must use the Supabase Shared Pooler host")
          if url.port != 5432:
              raise SystemExit("SUPABASE_DB_URL must use Session pooler port 5432")
          if url.username != f"postgres.{ref}":
              raise SystemExit("SUPABASE_DB_URL must use the project-scoped Session pooler user")
          if url.path != "/postgres":
              raise SystemExit("SUPABASE_DB_URL must target the postgres database")
          if not url.password:
              raise SystemExit("SUPABASE_DB_URL must include the database password")
          PY

      - name: Show migration status before deploy
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview pending migrations
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all 2>&1 | tee "$log_file"

          if grep -q '^Would push these migrations:' "$log_file"; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Database drift detected"
              echo
              echo "GitHub main contains migrations that are not yet applied to the linked Supabase project."
              echo "Review the preview above, then run this workflow manually with `mode=apply`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Database is synchronized"
              echo
              echo "No pending migrations were found."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail visible drift check
        if: steps.preview.outputs.pending == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'apply')
        shell: bash
        run: |
          echo "::error::Pending Supabase migrations detected. Review the dry-run output, then rerun Deploy Database Migrations with mode=apply."
          exit 1

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      - name: Show migration status after deploy
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Verify no pending migrations remain
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all 2>&1 | tee "$log_file"

          if grep -q '^Would push these migrations:' "$log_file"; then
            echo "::error::Database apply completed, but pending migrations still remain."
            {
              echo "### Database apply verification failed"
              echo
              echo "Pending migrations still remain after apply. Inspect the workflow log before continuing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Database apply verified"
            echo
            echo "Local migration history and the linked Supabase project are synchronized."
          } >> "$GITHUB_STEP_SUMMARY"
