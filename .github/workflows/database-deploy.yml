name: Deploy Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/database-deploy.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose dry-run first. Apply only after reviewing the migration list."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: onepick-database-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy credentials live only in the Production environment (main only),
    # not at repository level (#426 M9).
    environment: Production
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
      SUPABASE_PROJECT_REF: ygoipwzakzdnkaaxyrgb

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret"; exit 1; }
          test -n "$SUPABASE_DB_POOLER_HOST" || { echo "Missing SUPABASE_DB_POOLER_HOST variable"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Configure IPv4 Session pooler URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import quote

          ref = os.environ["SUPABASE_PROJECT_REF"]
          host = os.environ["SUPABASE_DB_POOLER_HOST"].strip()
          if not re.fullmatch(r"[a-z0-9-]+\.pooler\.supabase\.com", host):
              raise SystemExit("SUPABASE_DB_POOLER_HOST must be the Session pooler hostname only")

          encoded_password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          db_url = f"postgresql://postgres.{ref}:{encoded_password}@{host}:5432/postgres?sslmode=require"
          print(f"::add-mask::{encoded_password}")
          print(f"::add-mask::{db_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SUPABASE_DB_URL={db_url}\n")
          PY

      - name: Show migration status before deploy
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview pending migrations
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all 2>&1 | tee "$log_file"

          if grep -q '^Would push these migrations:' "$log_file"; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Database drift detected"
              echo
              echo "GitHub main contains migrations that are not yet applied to the linked Supabase project."
              echo "Review the preview above, then run this workflow manually with `mode=apply`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Database is synchronized"
              echo
              echo "No pending migrations were found."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail visible drift check
        if: steps.preview.outputs.pending == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'apply')
        shell: bash
        run: |
          echo "::error::Pending Supabase migrations detected. Review the dry-run output, then rerun Deploy Database Migrations with mode=apply."
          exit 1

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      - name: Show migration status after deploy
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Verify no pending migrations remain
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run --include-all 2>&1 | tee "$log_file"

          if grep -q '^Would push these migrations:' "$log_file"; then
            echo "::error::Database apply completed, but pending migrations still remain."
            {
              echo "### Database apply verification failed"
              echo
              echo "Pending migrations still remain after apply. Inspect the workflow log before continuing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Database apply verified"
            echo
            echo "Local migration history and the linked Supabase project are synchronized."
          } >> "$GITHUB_STEP_SUMMARY"
