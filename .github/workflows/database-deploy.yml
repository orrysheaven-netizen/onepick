name: Deploy Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'tools/deploy/**'
      - '.github/workflows/database-deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Create a plan first; apply requires separate human approval.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      preview_run_id:
        description: 'Apply only: successful preview run ID'
        type: string
      approval_comment_id:
        description: 'Apply only: human approval comment ID in the configured issue'
        type: string

permissions:
  contents: read

concurrency:
  group: onepick-database-deploy
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'dry-run')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Preview needs DB credentials too. Environment secrets must be main-only.
    environment: Production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Build and verify immutable migration plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node tools/deploy/runtime.mjs plan
      - name: Upload plan data
        uses: actions/upload-artifact@v4
        with:
          name: db-deployment-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/db-deployment-plan/plan.json
          retention-days: 2
          if-no-files-found: error

  verify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No environment or DB secrets. A failed check prevents the apply job.
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Verify independent approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
        run: node tools/deploy/runtime.mjs verify

  apply:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - name: Checkout the approved workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Recheck, consume approval, apply and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          APPROVAL_COMMENT_ID: ${{ inputs.approval_comment_id }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node tools/deploy/runtime.mjs apply
