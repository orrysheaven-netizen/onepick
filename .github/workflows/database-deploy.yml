name: Deploy Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/database-deploy.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose dry-run first. Apply only after reviewing the migration list."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: onepick-database-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploy credentials live only in the Production environment (main only),
    # not at repository level (#426 M9).
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ygoipwzakzdnkaaxyrgb

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Link onepick-dev
        # Force the password-based Postgres flow. With scoped PATs, leaving the
        # password implicit can select the temporary/JIT path and lose the
        # IPv4 Supavisor link on GitHub's IPv4-only runners.
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --debug

      - name: Diagnose IPv4 pooler link
        if: always()
        run: |
          ls -la supabase/.temp || true
          if test -s supabase/.temp/pooler-url; then
            echo "pooler-url=present"
          else
            echo "pooler-url=MISSING"
          fi

      - name: Show migration status before deploy
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          supabase db push --linked --dry-run --include-all --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$log_file"

          if grep -q '^Would push these migrations:' "$log_file"; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Database drift detected"
              echo
              echo "GitHub main contains migrations that are not yet applied to the linked Supabase project."
              echo "Review the preview above, then run this workflow manually with `mode=apply`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Database is synchronized"
              echo
              echo "No pending migrations were found."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail visible drift check
        if: steps.preview.outputs.pending == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'apply')
        shell: bash
        run: |
          echo "::error::Pending Supabase migrations detected. Review the dry-run output, then rerun Deploy Database Migrations with mode=apply."
          exit 1

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration status after deploy
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Verify no pending migrations remain
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          supabase db push --linked --dry-run --include-all --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$log_file"

          if grep -q '^Would push these migrations:' "$log_file"; then
            echo "::error::Database apply completed, but pending migrations still remain."
            {
              echo "### Database apply verification failed"
              echo
              echo "Pending migrations still remain after apply. Inspect the workflow log before continuing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "### Database apply verified"
            echo
            echo "Local migration history and the linked Supabase project are synchronized."
          } >> "$GITHUB_STEP_SUMMARY"
