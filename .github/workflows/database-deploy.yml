name: Deploy Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/database-deploy.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose dry-run first. Apply only after reviewing the migration list."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: onepick-database-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ygoipwzakzdnkaaxyrgb

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link onepick-dev
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration status before deploy
        run: supabase migration list --linked

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run --include-all

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        run: supabase db push --linked --include-all

      - name: Show migration status after deploy
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
        run: supabase migration list --linked
