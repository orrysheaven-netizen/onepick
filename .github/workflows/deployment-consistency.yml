name: Deployment Consistency

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/qa/check-deployment-consistency.mjs'
      - 'tools/qa/check-deployment-consistency.test.mjs'
      - '.github/workflows/deployment-consistency.yml'
      - 'tools/qa/detect-edge-function-changes.py'
      - 'tools/qa/test_detect_edge_function_changes.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deployment-consistency
  cancel-in-progress: true

jobs:
  unit:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test Edge change detection
        run: python3 -m unittest discover -s tools/qa -p test_detect_edge_function_changes.py
      - name: Test deployment evaluator
        run: node tools/qa/check-deployment-consistency.test.mjs

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_BASE_URL: https://onepick-5cl.pages.dev
      SUPABASE_PROJECT_REF: ygoipwzakzdnkaaxyrgb
      DEPLOYMENT_CHECK_OUTPUT: ${{ github.workspace }}/deployment-consistency.json
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Edge Function changes
        id: edge
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/qa/detect-edge-function-changes.py

      - name: Compute main commit timestamp
        id: commit
        shell: bash
        run: echo "timestamp_ms=$(( $(git show -s --format=%ct "$GITHUB_SHA") * 1000 ))" >> "$GITHUB_OUTPUT"

      - name: Verify deployment consistency
        id: verify
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: main
          COMMIT_TIMESTAMP_MS: ${{ steps.commit.outputs.timestamp_ms }}
          CHANGED_EDGE_FUNCTIONS: ${{ steps.edge.outputs.slugs }}
          SUPABASE_QA_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: node tools/qa/check-deployment-consistency.mjs

      - name: Write summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DEPLOYMENT_CHECK_OUTPUT" ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.env.DEPLOYMENT_CHECK_OUTPUT, 'utf8'));
          console.log('### Deployment consistency');
          console.log(`- main: \`${r.expectedSha}\``);
          console.log(`- Cloudflare: ${r.cloudflare.ok ? 'OK' : 'MISMATCH'} — ${r.cloudflare.reason}`);
          console.log(`- Edge Functions: ${r.edge.ok ? 'OK' : 'MISMATCH'} — ${r.edge.reason}`);
          for (const fn of r.edge.functions ?? []) {
            console.log(`  - ${fn.slug}: ${fn.ok ? 'OK' : 'MISMATCH'} — ${fn.reason}`);
          }
          NODE
          else
            echo "### Deployment consistency" >> "$GITHUB_STEP_SUMMARY"
            echo "- Verification report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update qa-alert
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh label create qa-alert --repo "$REPOSITORY" --color D73A4A             --description "Automated QA or deployment mismatch requiring attention" --force

          report="$(printf '%s\n\n%s\n\n%s' \
            "Deployment consistency failed for main $MAIN_SHA." \
            "Workflow: $GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "The check waited for Cloudflare deployment metadata and, when Edge Function source changed, Supabase function deployment status. Inspect the workflow summary for the exact mismatch. No deployment or database mutation was attempted by this check.")"

          issue_number="$(gh issue list --repo "$REPOSITORY" --state open --label qa-alert             --search '"[qa-alert] Deployment mismatch" in:title' --json number,title             --jq '.[] | select(.title == "[qa-alert] Deployment mismatch") | .number' | head -n1)"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body "$report"
          else
            gh issue create --repo "$REPOSITORY" --title "[qa-alert] Deployment mismatch"               --label qa-alert --body "$report"
          fi

      - name: Fail on mismatch
        if: steps.verify.outcome == 'failure'
        run: exit 1

