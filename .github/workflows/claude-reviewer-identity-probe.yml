name: Claude Reviewer Identity Probe

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to receive a COMMENT-only identity probe'
        required: true
        type: string

# This workflow uses only the reviewer GitHub App token. The default GITHUB_TOKEN
# has no repository permissions.
permissions: {}

jobs:
  probe:
    if: ${{ vars.ONEPICK_CLAUDE_REVIEWER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create reviewer App token
        id: reviewer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ONEPICK_CLAUDE_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.ONEPICK_CLAUDE_REVIEWER_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write
          permission-statuses: read

      - name: Verify installation scope and permissions
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "pr_number must be a positive integer" >&2
            exit 1
          }

          pr_state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          test "$pr_state" = "open" || {
            echo "Identity probe requires an open pull request" >&2
            exit 1
          }

          installation_json="$(gh api /installation)"
          selection="$(jq -r '.repository_selection' <<<"$installation_json")"
          test "$selection" = "selected" || {
            echo "Reviewer App must use selected-repository installation scope" >&2
            exit 1
          }

          jq -e '
            .permissions.contents == "read" and
            .permissions.issues == "read" and
            .permissions.pull_requests == "write" and
            .permissions.actions == "read" and
            .permissions.checks == "read" and
            .permissions.statuses == "read" and
            ([.permissions | to_entries[]
              | select((.value == "write" or .value == "admin") and .key != "pull_requests")]
             | length) == 0
          ' <<<"$installation_json" >/dev/null || {
            echo "Reviewer App permissions are broader than the approved review-only profile" >&2
            jq '.permissions' <<<"$installation_json"
            exit 1
          }

          echo "Reviewer App installation scope and permissions match the approved profile."

      - name: Submit COMMENT-only identity probe
        id: review
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          APP_SLUG: ${{ steps.reviewer-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail

          body="OnePick Claude reviewer identity probe. COMMENT only; no approval, merge, code change, workflow dispatch, or database action was performed."

          response="$(
            gh api               --method POST               "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews"               -f event=COMMENT               -f body="$body"
          )"

          author="$(jq -r '.user.login' <<<"$response")"
          state="$(jq -r '.state' <<<"$response")"
          url="$(jq -r '.html_url // empty' <<<"$response")"
          expected_author="${APP_SLUG}[bot]"

          test "$author" = "$expected_author" || {
            echo "Unexpected review author: $author (expected $expected_author)" >&2
            exit 1
          }

          test "$state" = "COMMENTED" || {
            echo "Unexpected review state: $state" >&2
            exit 1
          }

          {
            echo "### Claude reviewer identity probe"
            echo "- Author: `$author`"
            echo "- State: `$state`"
            echo "- PR: #$PR_NUMBER"
            if [ -n "$url" ]; then
              echo "- Review: $url"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
