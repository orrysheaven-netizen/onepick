name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      # Regression tests in mobile/scripts load Edge Function sources directly.
      - 'supabase/functions/**'
      - '.github/workflows/mobile-ci.yml'
  # No path filter on pull_request: these jobs are required status checks on main,
  # and a filtered-out check never reports, which leaves such a PR unmergeable.
  # Draft PRs and unrelated changes are skipped at job level instead (see `changes`).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight gate. Draft PRs skip it entirely (zero runner minutes); for ready
  # PRs it decides whether the required job below needs its heavy steps. Anything
  # other than a successful "no relevant change" verdict runs the full job.
  changes:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # The gate script always comes from the base commit, never from the PR under
      # test, so a PR cannot rewrite the gate to skip its own required checks (#576 M1).
      - name: Checkout gate script (base commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            mobile/scripts

      - name: Decide whether heavy steps are needed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          # The files API stops at 3000 entries; a truncated list must not skip checks.
          if [ "$(wc -l < "$RUNNER_TEMP/changed-files.txt")" -ge 3000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Control-plane changes (the gate, its tests, any workflow) always run the
          # heavy job. Decided here, not by a script (#576 M1).
          if grep -Eq '^\.github/(scripts|workflows)/' "$RUNNER_TEMP/changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(bash .github/scripts/ci-path-gate.sh \
            --pattern '^(mobile/|supabase/|\.github/workflows/mobile-ci\.yml$)' \
            --referenced-in mobile/scripts \
            < "$RUNNER_TEMP/changed-files.txt")"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  typecheck:
    needs: changes
    # Required check: keep this job name. When skipped by this condition it reports
    # success, so draft or unrelated PRs never leave the check pending.
    if: >-
      !cancelled() &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (needs.changes.result != 'success' || needs.changes.outputs.run == 'true')
    runs-on: ubuntu-latest
    # Caps a hung run's billing (recent full runs ~2-3.5 min).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm test
