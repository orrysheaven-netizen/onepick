name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      # Regression tests in mobile/scripts load Edge Function sources directly.
      - 'supabase/functions/**'
      - 'tools/qa/**'
      - '.github/workflows/mobile-ci.yml'
  # No path filter on pull_request: these jobs are required status checks on main,
  # and a filtered-out check never reports, which leaves such a PR unmergeable.
  pull_request:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: QA credential regression tests
        working-directory: tools/qa
        run: npm test
