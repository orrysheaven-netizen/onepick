name: Daily QA

# Collects the data for the daily Claude QA report (docs/daily-qa.md).
# Runs at 06:00 KST so results are ready before the 07:00 KST Claude routine.
# Not a required check and never runs on pull requests.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (default: tester site)'
        required: false
        default: 'https://onepick-5cl.pages.dev'
      block_menu_ai:
        description: 'Block the paid menu-AI request (QA_BLOCK_MENU_AI=1); that check is reported as WARN/unverified, never PASS'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-qa
  cancel-in-progress: false

jobs:
  live-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/qa
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/qa/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run live QA
        env:
          QA_BASE_URL: ${{ inputs.base_url || 'https://onepick-5cl.pages.dev' }}
          QA_OUT_DIR: ${{ github.workspace }}/qa-output
        run: node live-qa.mjs

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-qa-live-web
          path: qa-output
          retention-days: 14

  # Logged-in user-flow QA with the dedicated QA general-user account
  # (docs/daily-qa.md "로그인 상태 QA 계정 규칙"). The credentials live only in the
  # `daily-qa` Environment, which only `main` may use, and this job never runs for
  # pull requests. Without the secrets the script records a skip and exits 0.
  logged-in:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: daily-qa
    defaults:
      run:
        working-directory: tools/qa
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/qa/package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run logged-in QA
        env:
          QA_BASE_URL: ${{ inputs.base_url || 'https://onepick-5cl.pages.dev' }}
          QA_OUT_DIR: ${{ github.workspace }}/qa-output
          ONEPICK_QA_EMAIL: ${{ secrets.ONEPICK_QA_EMAIL }}
          ONEPICK_QA_PASSWORD: ${{ secrets.ONEPICK_QA_PASSWORD }}
          # Opt-in safety mode for manual runs only; schedule runs leave it empty (unchanged).
          QA_BLOCK_MENU_AI: ${{ inputs.block_menu_ai && '1' || '' }}
        run: node logged-in-qa.mjs

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-qa-logged-in
          path: qa-output
          retention-days: 14

  real-user-errors:
    runs-on: ubuntu-latest
    # Reads Management API data with the repository-scoped read-only QA token.
    # Keep this main-only; do not attach Production because environment secrets
    # override repository secrets with the same name.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Summarize real-user errors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          QA_OUT_DIR: ${{ github.workspace }}/qa-output
        run: node tools/qa/real-user-errors.mjs

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-qa-real-user-errors
          path: qa-output
          retention-days: 14

  # Read-only DB health check (docs/daily-qa.md, automation-plan G-점검): Supabase
  # performance/security advisors and top slow pg_stat_statements, aggregates
  # only. Without SUPABASE_ACCESS_TOKEN the script records a skip and exits 0.
  db-health:
    runs-on: ubuntu-latest
    # Reads Management API data with the repository-scoped read-only QA token.
    # Keep this main-only; do not attach Production because environment secrets
    # override repository secrets with the same name.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check DB health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          QA_OUT_DIR: ${{ github.workspace }}/qa-output
        run: node tools/qa/db-health.mjs

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-qa-db-health
          path: qa-output
          retention-days: 14
