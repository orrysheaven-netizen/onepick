name: AI PM Assignment Dispatcher

on:
  issue_comment:
    types: [created]
  issues:
    types: [unlabeled, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to retry"
        required: true
        type: number

permissions: {}

concurrency:
  group: ai-pm-assignment-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       (startsWith(github.event.comment.body, 'PM_DIRECTIVE: ') ||
        startsWith(github.event.comment.body, '## 완료 리포트'))) ||
      (github.event_name == 'issues' &&
       (github.event.action == 'reopened' ||
        (github.event.action == 'unlabeled' &&
         (github.event.label.name == 'state:blocked' ||
          github.event.label.name == 'state:active' ||
          github.event.label.name == 'state:review'))))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create handoff App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AI_HANDOFF_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_HANDOFF_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: read

      - name: Checkout trusted dispatcher
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Dispatch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RETRY_ISSUE: ${{ inputs.issue }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = require('./.github/scripts/pm-dispatch.cjs');
            await run({ github, context, core });
