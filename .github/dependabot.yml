version: 2
updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Expo SDK decides these versions (expo/bundledNativeModules.json). Bumping one
    # alone leaves native modules out of step with the SDK, so they move together
    # in an SDK upgrade (`npx expo install expo@<sdk> --fix`), not here.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-worklets"
      - dependency-name: "@react-native-async-storage/async-storage"

  - package-ecosystem: npm
    directory: /tools/qa
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
